name: AI Creator - Gerar APK

on:
  workflow_dispatch:

jobs:
  build:
    name: Compilar AI Creator
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.35.7'
          cache: true

      - name: Criar Android moderno
        shell: bash
        run: |
          set -e
          if [ ! -f android/app/src/main/AndroidManifest.xml ]; then
            rm -rf android
            flutter create --platforms=android --android-language kotlin --org com.aicreator --project-name ai_creator .
          fi

      - name: Aplicar nome e icone AI Creator
        shell: bash
        run: |
          set -e
          MANIFEST=android/app/src/main/AndroidManifest.xml
          mkdir -p android/app/src/main/res/drawable-nodpi
          if [ -f assets_ai_icon.png ]; then
            cp assets_ai_icon.png android/app/src/main/res/drawable-nodpi/ai_creator_icon.png
          elif [ -f launcher_icon.png ]; then
            cp launcher_icon.png android/app/src/main/res/drawable-nodpi/ai_creator_icon.png
          else
            echo 'Icone não encontrado'; exit 1
          fi
          sed -i 's#android:label="[^"]*"#android:label="AI Creator"#g' "$MANIFEST"
          sed -i 's#android:icon="[^"]*"#android:icon="@drawable/ai_creator_icon"#g' "$MANIFEST"
          if ! grep -q 'android:label="AI Creator"' "$MANIFEST"; then
            sed -i 's#<application #<application android:label="AI Creator" #' "$MANIFEST"
          fi
          if ! grep -q 'android:icon="@drawable/ai_creator_icon"' "$MANIFEST"; then
            sed -i 's#<application #<application android:icon="@drawable/ai_creator_icon" #' "$MANIFEST"
          fi

      - name: Verificar Android V2
        shell: bash
        run: |
          set -e
          test -f android/app/src/main/AndroidManifest.xml
          test -f android/app/src/main/kotlin/com/aicreator/ai_creator/MainActivity.kt
          if grep -R 'io.flutter.app.FlutterActivity\|io.flutter.app.FlutterApplication' android 2>/dev/null; then
            echo 'Android V1 encontrado.'
            exit 1
          fi

      - name: Flutter pub get
        run: flutter pub get

      - name: Build APK
        shell: bash
        run: |
          set +e
          flutter build apk --release 2>&1 | tee build.log
          code=${PIPESTATUS[0]}
          echo "BUILD_EXIT=$code" >> "$GITHUB_ENV"
          exit $code

      - name: Resumo
        if: always()
        run: |
          if [ "${BUILD_EXIT:-1}" = "0" ]; then
            echo '## ✅ AI Creator compilado' >> "$GITHUB_STEP_SUMMARY"
            echo 'Nome: **AI Creator**' >> "$GITHUB_STEP_SUMMARY"
            echo 'Artefato: **AI-Creator-APK**' >> "$GITHUB_STEP_SUMMARY"
          else
            echo '## ❌ Falha na compilação' >> "$GITHUB_STEP_SUMMARY"
            echo 'Baixe **AI-Creator-Logs** para ver o build.log.' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: AI-Creator-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AI-Creator-Logs
          path: build.log
          if-no-files-found: ignore
