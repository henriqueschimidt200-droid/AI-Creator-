name: AI Creator - Build + Diagnóstico Completo

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose-build:
    name: Diagnosticar e gerar APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 1 - Baixar projeto
        uses: actions/checkout@v4

      - name: 2 - Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: 3 - Flutter estável
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: 4 - Informações do ambiente
        shell: bash
        run: |
          flutter --version | tee environment.log
          dart --version | tee -a environment.log
          java -version 2>&1 | tee -a environment.log
          echo "=== pubspec.yaml ===" | tee -a environment.log
          sed -n '1,220p' pubspec.yaml | tee -a environment.log

      - name: 5 - Verificar arquivos essenciais
        shell: bash
        run: |
          set +e
          : > preflight.log
          echo "=== VERIFICAÇÃO INICIAL ===" | tee -a preflight.log

          for f in pubspec.yaml lib/main.dart android/app/src/main/AndroidManifest.xml; do
            if [ -f "$f" ]; then
              echo "OK: $f" | tee -a preflight.log
            else
              echo "ERRO: arquivo ausente: $f" | tee -a preflight.log
            fi
          done

          echo "=== ESTRUTURA ANDROID ===" | tee -a preflight.log
          find android -maxdepth 4 -type f 2>/dev/null | sort | head -200 | tee -a preflight.log

          echo "=== REFERÊNCIAS ANDROID V1 ===" | tee -a preflight.log
          grep -RniE "io\.flutter\.app\.Flutter(Activity|Application)|android:name=\"io\.flutter\.app" android 2>/dev/null | tee -a preflight.log || true

          if [ -f android/app/src/main/AndroidManifest.xml ]; then
            echo "=== MANIFEST ===" | tee -a preflight.log
            sed -n '1,240p' android/app/src/main/AndroidManifest.xml | tee -a preflight.log
          fi

      - name: 6 - Instalar dependências
        shell: bash
        run: |
          set +e
          flutter clean 2>&1 | tee clean.log
          flutter pub get 2>&1 | tee pub_get.log
          exit ${PIPESTATUS[0]}

      - name: 7 - Análise Dart e erros de sintaxe
        shell: bash
        run: |
          set +e
          flutter analyze --no-fatal-infos 2>&1 | tee analyze.log
          ANALYZE_EXIT=${PIPESTATUS[0]}
          echo "ANALYZE_EXIT=$ANALYZE_EXIT" >> diagnostic.env
          exit 0

      - name: 8 - Teste de compilação Dart
        shell: bash
        run: |
          set +e
          flutter build bundle --release 2>&1 | tee dart_compile.log
          EXIT_CODE=${PIPESTATUS[0]}
          echo "DART_COMPILE_EXIT=$EXIT_CODE" >> diagnostic.env
          exit 0

      - name: 9 - Gerar APK
        shell: bash
        run: |
          set +e
          flutter build apk --release 2>&1 | tee build.log
          BUILD_EXIT=${PIPESTATUS[0]}
          echo "BUILD_EXIT=$BUILD_EXIT" >> diagnostic.env
          exit 0

      - name: 10 - Identificar exatamente o problema
        if: always()
        shell: bash
        run: |
          set +e
          source diagnostic.env 2>/dev/null || true

          {
            echo "# 🩺 DIAGNÓSTICO DO AI CREATOR"
            echo
            echo "**Data:** $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
            echo
            echo "## Resultado"
            if [ "${BUILD_EXIT:-1}" = "0" ]; then
              echo "### ✅ APK GERADO COM SUCESSO"
              echo
              echo "Arquivo: \`build/app/outputs/flutter-apk/app-release.apk\`"
            else
              echo "### ❌ APK NÃO GERADO"
            fi
            echo
            echo "## Problema detectado"
          } > diagnostic_report.md

          if grep -qE "Can't find '\)' to match|Can't find '\}' to match|Expected to find|Unexpected token|Error: .*\.dart:" analyze.log dart_compile.log build.log 2>/dev/null; then
            echo "**Categoria: ERRO DE SINTAXE DART.**" >> diagnostic_report.md
            echo >> diagnostic_report.md
            grep -E "Error: .*\.dart:|Can't find|Expected to find|Unexpected token" analyze.log dart_compile.log build.log 2>/dev/null | head -40 >> diagnostic_report.md
          elif grep -qE "Member not found|The getter .* isn't defined|The method .* isn't defined|Undefined name" analyze.log dart_compile.log build.log 2>/dev/null; then
            echo "**Categoria: CÓDIGO DART — MÉTODO/PROPRIEDADE NÃO EXISTE.**" >> diagnostic_report.md
            echo >> diagnostic_report.md
            grep -E "Member not found|isn't defined|Undefined name" analyze.log dart_compile.log build.log 2>/dev/null | head -40 >> diagnostic_report.md
          elif grep -qE "Cannot invoke a non-'const' constructor|constant expression" analyze.log dart_compile.log build.log 2>/dev/null; then
            echo "**Categoria: ERRO DE CONST NO DART.**" >> diagnostic_report.md
            echo >> diagnostic_report.md
            grep -E "Cannot invoke a non-'const' constructor|constant expression" analyze.log dart_compile.log build.log 2>/dev/null | head -30 >> diagnostic_report.md
          elif grep -qE "Android V1|deleted Android v1 embedding|io\.flutter\.app\.Flutter" build.log preflight.log 2>/dev/null; then
            echo "**Categoria: ANDROID V1 / PROJETO ANDROID ANTIGO.**" >> diagnostic_report.md
            echo >> diagnostic_report.md
            grep -Ei "Android V1|deleted Android v1 embedding|io\.flutter\.app\.Flutter" build.log preflight.log 2>/dev/null | head -30 >> diagnostic_report.md
          elif grep -qE "google-services|FirebaseApp|DefaultFirebaseOptions|firebase_options" build.log analyze.log dart_compile.log 2>/dev/null; then
            echo "**Categoria: CONFIGURAÇÃO FIREBASE.**" >> diagnostic_report.md
            echo >> diagnostic_report.md
            grep -Ei "google-services|FirebaseApp|DefaultFirebaseOptions|firebase_options" build.log analyze.log dart_compile.log 2>/dev/null | head -30 >> diagnostic_report.md
          elif grep -qE "Could not resolve|Could not find|pub get failed|version solving failed" pub_get.log build.log 2>/dev/null; then
            echo "**Categoria: DEPENDÊNCIA/PUBSPEC.**" >> diagnostic_report.md
            echo >> diagnostic_report.md
            grep -Ei "Could not resolve|Could not find|pub get failed|version solving failed" pub_get.log build.log 2>/dev/null | head -40 >> diagnostic_report.md
          elif grep -qE "NDK|CMake|SDK location|licenses" build.log 2>/dev/null; then
            echo "**Categoria: ANDROID SDK/NDK.**" >> diagnostic_report.md
            echo >> diagnostic_report.md
            grep -Ei "NDK|CMake|SDK location|licenses" build.log 2>/dev/null | tail -40 >> diagnostic_report.md
          elif [ "${BUILD_EXIT:-1}" = "0" ]; then
            echo "Nenhum erro de compilação detectado." >> diagnostic_report.md
          else
            echo "**Categoria: ERRO NÃO CLASSIFICADO.**" >> diagnostic_report.md
            echo >> diagnostic_report.md
            echo "As últimas linhas do build são:" >> diagnostic_report.md
            tail -80 build.log 2>/dev/null >> diagnostic_report.md
          fi

          echo >> diagnostic_report.md
          echo "## Arquivos para investigação" >> diagnostic_report.md
          echo "- \`analyze.log\` — erros do Dart" >> diagnostic_report.md
          echo "- \`dart_compile.log\` — compilação Dart" >> diagnostic_report.md
          echo "- \`build.log\` — Gradle/Android/Flutter" >> diagnostic_report.md
          echo "- \`preflight.log\` — estrutura do projeto" >> diagnostic_report.md

          cat diagnostic_report.md >> "$GITHUB_STEP_SUMMARY"

      - name: 11 - Salvar diagnóstico completo
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AI-Creator-Diagnostico
          path: |
            diagnostic_report.md
            diagnostic.env
            environment.log
            preflight.log
            clean.log
            pub_get.log
            analyze.log
            dart_compile.log
            build.log
          if-no-files-found: warn

      - name: 12 - Publicar APK
        if: env.BUILD_EXIT == '0'
        uses: actions/upload-artifact@v4
        with:
          name: AI-Creator-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
